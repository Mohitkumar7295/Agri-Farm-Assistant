spring.application.name=agrifarm-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Supabase PostgreSQL 16 + pgvector (Session Pooler / Direct)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrifarm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres_secure_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Sizing (Single-Container + Supabase Pooler)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA & Flyway Migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Configuration (30-day stateless sessions)
app.jwt.secret=${JWT_SECRET:b7e28f3a91c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0}
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:30}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Resend Email OTP Sentinel Configuration
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Spring Mail SMTP Fallback Configuration
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

# Actuator Health (do not fail health check when local Redis is not running)
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# Logging
logging.level.com.agrifarm=INFO
