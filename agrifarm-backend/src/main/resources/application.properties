spring.application.name=agrifarm-backend
server.port=8080

# MongoDB Configuration (Injected securely via environment variable or default)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/agrifarm_db}
spring.data.mongodb.database=agrifarm_db
spring.data.mongodb.auto-index-creation=true

# Resend Email OTP Sentinel Configuration (Injected via RESEND_API_KEY environment variable)
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Spring Mail SMTP Configuration (For arbitrary recipients without Resend domain restrictions)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}

# Exclude SQL / JPA autoconfiguration when running with MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration

# Logging
logging.level.com.agrifarm=INFO
